name: CI

# V2 lives on its own long-lived branch and does NOT deploy. `main` continues
# to serve V1 to production untouched, exactly as the migration strategy
# requires (PROJECT_PROGRESS §10). This workflow verifies; it never publishes.
on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Kept in step with `engines.node` in package.json.
          node-version: '24'
          cache: npm

      # `npm ci`, not `npm install`: it installs strictly from the committed
      # lockfile and verifies every package's integrity hash, so CI cannot
      # silently resolve a different tree than a developer did.
      - name: Install
        run: npm ci

      # Build-time GitHub retrieval. `continue-on-error` is the whole point:
      # a GitHub outage, a rate limit or a network blip must never fail this
      # build. When this step does not produce `github.generated.json`, the
      # build reads the committed `github.snapshot.json` instead and the site
      # is complete — just with slightly older repository figures. That is an
      # integration; failing the build here would be a deployment dependency.
      #
      # GITHUB_TOKEN is the runner's own automatic token. It never leaves the
      # runner, and only the allow-listed fields in fetch-github.mjs are
      # written to disk, so no credential can reach the output.
      - name: Refresh GitHub repository data
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run github:fetch

      # `npm run verify` = astro check + astro build + scripts/verify-output.mjs.
      # CI runs the exact command a developer runs locally, so the two can
      # never drift: the assertions live in the script, not in this file.
      # What the script guards is documented at the top of it — briefly: a page
      # silently vanishing from the eight-world IA, the no-JS fallback content
      # being dropped from the static HTML, an inline script the CSP would kill
      # at runtime with no build error, and any third-party origin.
      - name: Verify
        run: npm run verify

      # The two properties `verify` structurally cannot check, because both
      # only exist when something has gone wrong: that the site still builds
      # and tells the truth with no GitHub data at all, and that a credential
      # in the output actually fails the gate. It rebuilds twice; that is
      # about four seconds here and it is the only test of the fallback.
      - name: Test the GitHub fallback and secret isolation
        run: npm run test:github

      - name: Audit dependencies
        run: npm audit --audit-level=high
