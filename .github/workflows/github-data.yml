name: GitHub data

# K4 — the scheduled half of the build-time GitHub integration
# (PROJECT_PROGRESS §8.3, §9.6).
#
# `deploy.yml` already refreshes the data on every push to `main`, so the site
# is current whenever it deploys. What is missing without this workflow is the
# FALLBACK going stale: `github.snapshot.json` is the committed last-known-good
# that the build reads when a fetch fails, and a fallback last written months
# ago is a fallback that lies. This job's only job is to keep it fresh.
#
# Cadence is the §9.6 recommendation — every six hours, plus on demand. The
# repositories change a few times a week at most; six hours costs four runs a
# day of about twenty seconds each and is comfortably inside the free tier.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# `contents: write` commits the refreshed snapshot back to `main`.
#
# `actions: write` (M18) is the minimum grant for one API call: starting
# `deploy.yml` via workflow_dispatch after a snapshot commit. It is narrower
# than the `contents: write` this workflow already holds — a workflow that can
# push to `main` is strictly more powerful than one that can start a workflow —
# and it grants nothing towards Pages. `pages: write` and `id-token: write`
# remain confined to the `deploy` job of `deploy.yml`, which is where the only
# `actions/deploy-pages` invocation in the repository lives.
permissions:
  contents: write
  actions: write

# One at a time. Two overlapping runs would race on the same push, and the
# second would fail on a non-fast-forward. No cancel-in-progress: a run that
# has already fetched should be allowed to finish committing.
concurrency:
  group: github-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `main` since the V2 cutover (M13-C). This must track the branch
          # production is built from: the snapshot it refreshes is the fallback
          # `deploy.yml` reads when a live fetch fails, so refreshing it on any
          # other branch would leave production's fallback to go stale — the
          # exact failure this workflow exists to prevent.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # No `npm ci`. `scripts/fetch-github.mjs` has zero dependencies — Node 22+
      # has global `fetch` — so installing the toolchain here would buy nothing
      # but a minute of runner time and a lockfile's worth of supply chain.
      #
      # GITHUB_TOKEN is the runner's automatic token, scoped to this repository
      # and expiring with the job. It raises the rate limit from 60 to 5000
      # req/hr and never leaves the runner: only the allow-listed fields in
      # `normalise` are written to disk, and Actions masks the value in logs.
      #
      # `--promote` is a no-op unless a repository fact actually changed, so a
      # quiet week produces no commits rather than 28 timestamp bumps.
      - name: Refresh the committed snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github.mjs --promote

      # Verifying before committing matters more here than in CI: this job
      # writes to the branch unattended. A snapshot that breaks the build must
      # not be the thing that lands while nobody is looking.
      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      # ── M18: commit, then ASK for a deployment ───────────────────────────
      # The commit below is authored with the runner's automatic GITHUB_TOKEN,
      # and GitHub deliberately does not start workflow runs from events that
      # token creates — the recursion guard. Proven, not assumed: bot commit
      # `b310619` is a real push to `main`, and the Actions API reports
      # total_count 0 runs for it, even though `deploy.yml` triggers on
      # `push: [main]`. The consequence was that a refreshed snapshot sat on
      # `main` while production kept serving the older figures until some other
      # push happened to come along.
      #
      # `workflow_dispatch` and `repository_dispatch` are the two documented
      # exceptions to that guard, so the fix is to ask for the deploy
      # explicitly rather than to rely on the push being noticed. This is
      # inside the `if`-guarded tail of the step ON PURPOSE: when no repository
      # fact moved there is no commit, and therefore no deployment either. A
      # quiet week costs nothing.
      #
      # No loop is possible. This dispatches `deploy.yml` and nothing else;
      # `deploy.yml` neither pushes nor dispatches, and this workflow is
      # reachable only by `schedule` and by a human `workflow_dispatch`. The
      # chain is two steps deep and terminates.
      #
      # `gh` is preinstalled on GitHub-hosted runners — no third-party action,
      # no dependency, no PAT. The dispatch carries no input; `deploy.yml`
      # re-runs every gate on `main` exactly as it does for a human push, so
      # only a validated artifact can reach Pages.
      - name: Commit if the facts moved, and deploy if they did
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/github.snapshot.json; then
            echo "Snapshot unchanged; nothing to commit, nothing to deploy."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/github.snapshot.json
          git commit -m 'chore(data): refresh the GitHub fallback snapshot'
          git push
          echo "Snapshot committed; requesting a production deployment."
          gh workflow run deploy.yml --ref main
